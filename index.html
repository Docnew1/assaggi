<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Reproductor IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
.app { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #000; }
.player-section { height: 42vh; min-height: 220px; background: #000; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; min-width: 0; flex: 0 0 auto; position: relative; }
.topbar { flex: 0 0 78px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; background: #000; border-bottom: 1px solid rgba(255,255,255,0.05); transition: opacity 0.3s ease; }
.player-title { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.video-wrap { flex: 1; min-height: 0; background: #000; position: relative; }

/* Stile speciale per il bottone in modalità Full Screen (fluttuante e con dissolvenza) */
.doc-btn { border: 3px solid #00ff66; border-radius: 22px; padding: 10px 20px; cursor: pointer; white-space: nowrap; background: #28a745; box-shadow: 0 0 12px rgba(40, 167, 69, 0.3), inset 0 0 18px rgba(255,255,255,0.1), inset 0 0 30px rgba(0,0,0,0.2); transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease, opacity 0.5s ease; z-index: 99; }
.doc-btn strong { display: inline-block; color: #000000; font-size: 14px; font-weight: 900; letter-spacing: 0.4px; }
.doc-btn:hover, .doc-btn:active { transform: scale(1.03); filter: brightness(1.08); background: #218838; box-shadow: 0 0 16px rgba(40, 167, 69, 0.5), inset 0 0 18px rgba(255,255,255,0.2), inset 0 0 30px rgba(0,0,0,0.3); }

/* Quando siamo in Full Screen, nascondiamo la topbar standard e posizioniamo il bottone in alto a destra sopra il video */
:fullscreen .topbar { display: none !important; }
:-webkit-full-screen .topbar { display: none !important; }
:-moz-full-screen .topbar { display: none !important; }
:-ms-fullscreen .topbar { display: none !important; }

:fullscreen .doc-btn, :-webkit-full-screen .doc-btn, :-moz-full-screen .doc-btn { position: absolute; top: 15px; right: 15px; }

/* Classe per nascondere il bottone con dissolvenza */
.doc-btn.fade-out { opacity: 0; pointer-events: none; }

video { width: 100%; height: 100%; display: block; background: #000; object-fit: contain; }
.list-section { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #0b0b0b; min-width: 0; }
.list-header { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); background: #111; font-size: 14px; font-weight: bold; flex: 0 0 auto; }
.table-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; }
tr { border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
tr:hover { background: rgba(255,255,255,0.05); }
tr.active { background: rgba(0, 207, 255, 0.14); }
tr.separator { background: #1a1a1a; cursor: default; opacity: 0.9; font-weight: bold; text-align: center; }
tr.separator:hover { background: #1a1a1a; }
td { padding: 10px 8px; vertical-align: middle; font-size: 14px; }
.col-logo { width: 58px; text-align: center; }
.logo { width: 42px; height: 42px; object-fit: contain; border-radius: 8px; background: #1a1a1a; display: inline-block; }
.name-box { display: flex; flex-direction: column; gap: 3px; }
.channel-name { font-weight: bold; line-height: 1.2; }
.channel-sub { font-size: 12px; opacity: 0.75; }
.play-badge { display: inline-block; min-width: 64px; text-align: center; padding: 6px 10px; border-radius: 999px; background: #2ecc71; color: #000; font-size: 12px; font-weight: bold; }
/* ===== Mode PC / TV ===== */
body.desktop-tv-mode .app { flex-direction: row-reverse; align-items: flex-start; }
body.desktop-tv-mode .player-section { width: 70vw; height: 46vh; min-height: 320px; max-height: 520px; border-bottom: 0; border-left: 1px solid rgba(255,255,255,0.08); align-self: flex-start; }
body.desktop-tv-mode .list-section { width: 30vw; height: 100vh; flex: 0 0 auto; }
@media (max-width: 899px) { body:not(.desktop-tv-mode) .app { flex-direction: column; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

    <div class="video-wrap">

  <div class="list-section">

];

let video = document.getElementById('video');
const channelsBody = document.getElementById('channelsBody');
const playerTitle = document.getElementById('playerTitle');
const docBtn = document.getElementById('docBtn');
const playerSection = document.getElementById('wrap');
let hls = null;
let activeIndex = -1;
let fadeTimer = null;

function applyLayoutMode() {
  const w = window.innerWidth || document.documentElement.clientWidth || screen.width || 0;
  const h = window.innerHeight || document.documentElement.clientHeight || screen.height || 0;
  const desktopTvMode = w >= 900 || (w >= 760 && w > h);
  document.body.classList.toggle("desktop-tv-mode", desktopTvMode);
}

function destroyHls() {
  if (hls) {
    try { hls.destroy(); } catch (e) {}
    hls = null;
  }
}

function loadChannel(index) {
  if (index < 0 || index >= channels.length) return;
  const ch = channels[index];

  activeIndex = index;
  playerTitle.textContent = ch.name;
  highlightActiveRow();
  
  try { video.pause(); } catch(e) {}
  destroyHls();
  
  video.removeAttribute('src');
  video.load();

  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      fragLoadingTimeOut: 10000,
      manifestLoadingTimeOut: 10000
    });
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play().catch(function() {});
    });
    
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        playerTitle.textContent = ch.name + " (Non disponibile)";
        destroyHls();
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = ch.url;
    video.addEventListener('loadedmetadata', function() {
      video.play().catch(function() {});
    }, { once: true });
    video.addEventListener('error', function() {
      playerTitle.textContent = ch.name + " (Non disponibile)";
    }, { once: true });
  }
}

function highlightActiveRow() {
  const rows = document.querySelectorAll('tr[data-index]');
  rows.forEach(function(row) {
    const idx = parseInt(row.getAttribute('data-index'), 10);
    const isActive = (idx === activeIndex);
    row.classList.toggle('active', isActive);
    
    if (isActive) {
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });
}

function renderChannels() {
  channelsBody.innerHTML = '';

  const sepTr = document.createElement('tr');
  sepTr.className = 'separator';
  const sepTd = document.createElement('td');
  sepTd.colSpan = 3;
  sepTd.textContent = '----- DOC ITALIA TV-----';
  sepTr.appendChild(sepTd);
  channelsBody.appendChild(sepTr);

  channels.forEach(function(ch, index) {
    const tr = document.createElement('tr');
    tr.setAttribute('data-index', index);

    const tdLogo = document.createElement('td');
    tdLogo.className = 'col-logo';
    const img = document.createElement('img');
    img.className = 'logo';
    img.alt = ch.name || '';
    img.src = ch.logo || '';
    img.onerror = function() { this.style.visibility = 'hidden'; };
    tdLogo.appendChild(img);

    const tdInfo = document.createElement('td');
    const nameBox = document.createElement('div');
    nameBox.className = 'name-box';
    const nameDiv = document.createElement('div');
    nameDiv.className = 'channel-name';
    nameDiv.textContent = ch.name;
    const subDiv = document.createElement('div');
    subDiv.className = 'channel-sub';
    subDiv.textContent = 'Tocca per riprodurre';
    nameBox.appendChild(nameDiv);
    nameBox.appendChild(subDiv);
    tdInfo.appendChild(nameBox);

    const tdAction = document.createElement('td');
    tdAction.style.width = '80px';
    tdAction.style.textAlign = 'right';
    const badge = document.createElement('span');
    badge.className = 'play-badge';
    badge.textContent = 'Guarda';
    tdAction.appendChild(badge);

    tr.appendChild(tdLogo);
    tr.appendChild(tdInfo);
    tr.appendChild(tdAction);

    tr.addEventListener('click', function() {
      loadChannel(index);
    });

    channelsBody.appendChild(tr);
  });
}

// Gestione della dissolvenza automatica del bottone in Full Screen
function resetFadeTimer() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) return;
  docBtn.classList.remove('fade-out');
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(function() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      docBtn.classList.add('fade-out');
    }
  }, 3000); // Sfuma dopo 3 secondi
}

// Mostra il bottone se muovi il mouse o tocchi lo schermo in Full Screen
playerSection.addEventListener('mousemove', resetFadeTimer);
playerSection.addEventListener('touchstart', resetFadeTimer);

// Attivazione / Disattivazione Full Screen al click sul bottone
docBtn.addEventListener('click', function() {
  const elem = playerSection;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (video.requestFullscreen) {
      video.requestFullscreen();
    }
    resetFadeTimer();
  } else {
    clearTimeout(fadeTimer);
    docBtn.classList.remove('fade-out');
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
});

// Ripristina il bottone quando si esce dal full screen
document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement) {
    clearTimeout(fadeTimer);
    docBtn.classList.remove('fade-out');
  }
});
document.addEventListener('webkitfullscreenchange', function() {
  if (!document.webkitFullscreenElement) {
    clearTimeout(fadeTimer);
    docBtn.classList.remove('fade-out');
  }
});

applyLayoutMode();
window.addEventListener('resize', applyLayoutMode);
window.addEventListener('orientationchange', applyLayoutMode);
renderChannels();

if (channels.length > 0) {
  loadChannel(0);
}
</script>

</html>
